name: Generate Datas

on:
  schedule: # executa a cada 12 horas
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    permissions:
      contents: write # Garante permissão de escrita para o robô do GitHub
    steps:
      # Baixa o repositório
      - uses: actions/checkout@v4

     # Snake Animation
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: profernandosirianni
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#39d353&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      # Publica no branch output (versão atualizada v4)
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
